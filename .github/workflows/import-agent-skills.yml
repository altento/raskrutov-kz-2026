name: Import project agent skills

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-agent-skills.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild and validate skill bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/skills-import/agent-skills.part{1,2,3,4,5} > /tmp/agent-skills.b64
          base64 --decode /tmp/agent-skills.b64 > /tmp/agent-skills.tar.gz
          echo 'e6afd77d061fb6c5aab78d508ff35cbf7e14c9d52c4526a47e2c1a667469ec75  /tmp/agent-skills.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/agent-skills.tar.gz -C .

          skill_count=$(find .agents/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)
          test "$skill_count" -eq 13

          for command in .cursor/commands/*.md; do
            skill=$(basename "$command" .md)
            test -f ".agents/skills/$skill/SKILL.md"
          done

          test -f .agents/skills/forms-standard/references/form-contract.md
          test -f .agents/skills/forms-standard/references/qa-checklist.md
          test -f .agents/skills/lp-motor-clean-migration/references/migration-report-template.md
          test -f .agents/skills/lp-motor-clean-migration/references/post-migration-search-patterns.md

      - name: Remove temporary importer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/skills-import
          rm -f .github/workflows/import-agent-skills.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .agents/skills .github/skills-import .github/workflows/import-agent-skills.yml
          git commit -m 'feat: add complete project agent skills bundle'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
