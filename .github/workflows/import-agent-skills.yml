name: Import project agent skills

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-agent-skills.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild and validate skill bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '8829bc3259bcd81c06b4f2fe74ca9ef7cc24aa9159994ae619154891177fad88  .github/skills-import/agent-skills.part1' | sha256sum --check --strict
          echo '79f9eb668d1591b6e841747791ce3fc7fc8731ae1353e5d3258697c392cf7fb3  .github/skills-import/agent-skills.part2' | sha256sum --check --strict
          echo '73739aa0127a65cc42ccb7847a3f6a13c9f048dbd734ca6e89b4e1c4d551f265  .github/skills-import/agent-skills.part3' | sha256sum --check --strict
          echo '69cfa5d0babb0f2b67b1ab50d15c147de37822c071ed60211ba02c8502aba60a  .github/skills-import/agent-skills.part4' | sha256sum --check --strict
          echo '5181d153200b619a461decf61c1dd41eed0bd60e1a18c5fae0b7e14578d25681  .github/skills-import/agent-skills.part5a' | sha256sum --check --strict
          echo 'e30c3bfbc47442a6aa81b3111394a2469d3071381d7dcb04fc749e285094c1b4  .github/skills-import/agent-skills.part5b' | sha256sum --check --strict

          cat .github/skills-import/agent-skills.part1 \
              .github/skills-import/agent-skills.part2 \
              .github/skills-import/agent-skills.part3 \
              .github/skills-import/agent-skills.part4 \
              .github/skills-import/agent-skills.part5a \
              .github/skills-import/agent-skills.part5b > /tmp/agent-skills.b64
          base64 --decode /tmp/agent-skills.b64 > /tmp/agent-skills.tar.gz
          echo 'e6afd77d061fb6c5aab78d508ff35cbf7e14c9d52c4526a47e2c1a667469ec75  /tmp/agent-skills.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/agent-skills.tar.gz -C .

          skill_count=$(find .agents/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)
          test "$skill_count" -eq 13

          for command in .cursor/commands/*.md; do
            skill=$(basename "$command" .md)
            test -f ".agents/skills/$skill/SKILL.md"
          done

          test -f .agents/skills/forms-standard/references/form-contract.md
          test -f .agents/skills/forms-standard/references/qa-checklist.md
          test -f .agents/skills/lp-motor-clean-migration/references/migration-report-template.md
          test -f .agents/skills/lp-motor-clean-migration/references/post-migration-search-patterns.md

      - name: Remove temporary importer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/skills-import
          rm -f .github/workflows/import-agent-skills.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .agents/skills .github/skills-import .github/workflows/import-agent-skills.yml
          git commit -m 'feat: add complete project agent skills bundle'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
