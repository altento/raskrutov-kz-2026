name: Finalize project agent skills

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-agent-skills.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download and validate skill bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/1377c9aa8b4b4d177bc10012f3dbc01ef70b7ac8" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/agent-skills.tar.gz

          echo 'd5483cd94a1b32ce8ea81e28124064718760a7ec924c4419b42da17bf8035c42  /tmp/agent-skills.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/agent-skills.tar.gz -C .

          skill_count=$(find .agents/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)
          test "$skill_count" -eq 13

          for command in .cursor/commands/*.md; do
            skill=$(basename "$command" .md)
            test -f ".agents/skills/$skill/SKILL.md"
          done

          test -f .agents/skills/forms-standard/references/form-contract.md
          test -f .agents/skills/forms-standard/references/qa-checklist.md
          test -f .agents/skills/lp-motor-clean-migration/references/migration-report-template.md
          test -f .agents/skills/lp-motor-clean-migration/references/post-migration-search-patterns.md

      - name: Commit complete skill bundle to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/skills-import
          rm -f .github/workflows/import-agent-skills.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .agents/skills .github/skills-import .github/workflows/import-agent-skills.yml
          git commit -m 'feat: add complete project agent skills bundle'
          git push origin HEAD:${{ github.head_ref }}
