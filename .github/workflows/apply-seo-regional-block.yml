name: Apply SEO regional block

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify installer
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path('.tmp/seo-regional-cities').glob('script.py.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 installer parts, found {len(parts)}')
          data = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts))
          digest = hashlib.sha256(data).hexdigest()
          expected = 'dafe8390eff7affd0845162eb0480a20893a3909d3b2a8f80f254db757ab557b'
          if digest != expected:
              raise SystemExit(f'Installer checksum mismatch: {digest}')
          Path('/tmp/apply_seo_regional_block.py').write_bytes(data)
          print(f'Installer verified: {digest}')

      - name: Normalize known archive transfer character
        shell: python
        run: |
          from pathlib import Path
          path = Path('.tmp/seo-regional-cities/assets.zip.b64.part04')
          payload = path.read_text(encoding='ascii')
          bad = 'M9V5/DG' + ' ' + 'ndzi42'
          good = 'M9V5/DG' + 'N' + 'dzi42'
          if bad not in payload:
              raise SystemExit('Expected transfer artifact was not found')
          path.write_text(payload.replace(bad, good, 1), encoding='ascii')
          print('Archive part 04 normalized')

      - name: Replace legacy regional section target
        shell: python
        run: |
          from pathlib import Path
          import re

          section_pattern = re.compile(
              r'<div\b(?=[^>]*(?:blk_class=["\']section["\']|class=["\'][^"\']*\bblk_section\b[^"\']*["\']))[^>]*>',
              re.I,
          )
          targets = [Path('site_mirror/web-studiya/seo-prodvizhenie/index.html')]
          optional = Path('site_deploy/web-studiya/seo-prodvizhenie/index.html')
          if optional.is_file():
              targets.append(optional)

          for path in targets:
              source = path.read_text(encoding='utf-8')
              contact_headings = list(re.finditer(r'>\s*Контакты\s*<', source, re.I))
              if not contact_headings:
                  raise SystemExit(f'{path}: contact heading not found')
              contact_heading = contact_headings[-1]
              starts = [m.start() for m in section_pattern.finditer(source) if m.start() < contact_heading.start()]
              if len(starts) < 2:
                  raise SystemExit(f'{path}: cannot locate section before bottom contacts')
              contact_start = starts[-1]
              legacy_start = starts[-2]
              legacy = source[legacy_start:contact_start]
              regional_links = legacy.lower().count('seo-prodvizhenie')
              if regional_links < 10:
                  excerpt = re.sub(r'\s+', ' ', legacy[:500])
                  raise SystemExit(f'{path}: previous section is not the legacy regional block; links={regional_links}; {excerpt}')
              path.write_text(source[:legacy_start] + source[contact_start:], encoding='utf-8', newline='\n')
              print(f'{path}: removed legacy regional section with {regional_links} SEO links')

          installer = Path('/tmp/apply_seo_regional_block.py')
          code = installer.read_text(encoding='utf-8')
          replacement = '''def locate_faq(source: str) -> int:
              markers = list(re.finditer(r">\\s*Контакты\\s*<", source, re.I))
              if not markers:
                  raise SystemExit("Не найден блок Контакты для установки регионального блока.")
              marker = markers[-1]
              starts = [s for s in section_starts(source, 0) if s < marker.start()]
              if not starts:
                  raise SystemExit("Не найдена секция Контакты для установки регионального блока.")
              return starts[-1]


          def build_block'''
          code, count = re.subn(
              r'def locate_faq\(source: str\) -> int:.*?\n\ndef build_block',
              replacement,
              code,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Installer target patch failed: replacements={count}')
          installer.write_text(code, encoding='utf-8')
          print('Installer target changed to the bottom Contacts section')

      - name: Apply and validate regional block
        run: python /tmp/apply_seo_regional_block.py

      - name: Remove one-time inputs
        run: rm -rf .tmp/seo-regional-cities

      - name: Commit generated page and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add regional SEO city navigation block"
          git push origin HEAD:"$TARGET_BRANCH"
